# Copy this file to one of:
# - macOS/Linux: ~/.config/work-journal-agent/config.toml
# - Windows: %APPDATA%\work-journal-agent\config.toml
# - or pass --config /path/to/config.toml

[storage]
# JSONL inbox used by all event sources.
inbox_path = "~/.local/share/work-journal-agent/inbox/events.jsonl"

# Fallback output directory when obsidian.vault_path is empty.
output_dir = "~/.local/share/work-journal-agent/out"

[obsidian]
# Keep empty to generate into storage.output_dir.
vault_path = ""
daily_dir = "Daily"
task_dir = "Tasks"
write_task_notes = false
knowledge_dir = "Knowledge"
write_knowledge_notes = false

[privacy]
# Keep raw user requests short. Set 0 to omit raw_request entirely.
max_raw_request_chars = 500

# Store Claude transcript paths as references, not transcript contents.
store_transcript_paths = true

[merge]
# Local pre-grouping threshold. Events with explicit session_id stay isolated first;
# DeepSeek cluster review can merge related sessions when enabled.
min_keyword_overlap = 1

[ai]
# Optional. When enabled, Work Journal asks DeepSeek to review requirement clusters
# and produce concise task summaries from compressed events.
enabled = false
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
timeout_seconds = 180
cache_enabled = true
cache_retention_days = 7
# cache_dir = "~/.local/share/work-journal-agent/ai-cache"
# Review candidate requirement groups before confirmation and Daily generation.
cluster_review_enabled = true
cluster_review_timeout_seconds = 240
cluster_review_min_confidence = 0.75
knowledge_enabled = false

[sources.codex]
enabled = true
sessions_root = "~/.codex/sessions"

[sources.claude]
enabled = false
settings_path = "~/.claude/settings.json"

[sources.opencode]
enabled = false
storage_root = "~/.local/share/opencode/storage"
plugin_path = "~/.config/opencode/plugins/work-journal-agent.js"

[sources.kun]
enabled = false
storage_root = "~/.kun/data"
project_root = "/path/to/project"

[sources.zcode]
enabled = false
storage_root = "~/.zcode/cli"
